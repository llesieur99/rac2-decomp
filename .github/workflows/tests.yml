name: Tool tests
on:
  push:
    branches: [RAC2]
  pull_request:
    branches: [RAC2]
  merge_group:
    branches: [RAC2]
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      base_sha: ${{ steps.route.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: route
        name: Verify test route
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = merge_group ] || [ ! -f scripts/maintainer_test_policy.py ]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
          else
            python scripts/maintainer_test_policy.py --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"
          fi
  validation:
    name: validation
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a completed test-route decision
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          TEST_MODE: ${{ needs.policy.outputs.mode }}
        run: |
          test "$POLICY_RESULT" = success
          case "$GITHUB_EVENT_NAME:$TEST_MODE" in
            merge_group:full|pull_request:full|pull_request:local|push:full|push:local|push:reuse|workflow_dispatch:full) ;;
            *) echo 'Missing or invalid test route'; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install qualified boundary decoder
        if: needs.policy.outputs.mode != 'local' || github.event_name == 'push'
        run: python -m pip install rabbitizer==1.16.2
      - name: Install pinned objdiff
        if: needs.policy.outputs.mode != 'local' && (github.event_name != 'pull_request' || needs.policy.outputs.mode == 'full')
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/objdiff-cli" \
            https://github.com/encounter/objdiff/releases/download/v3.8.1/objdiff-cli-linux-x86_64
          echo "c8290281e82114bcc1a06ff73061110d3902a177822e750337de2537188e358f  $RUNNER_TEMP/objdiff-cli" | sha256sum --check
          chmod +x "$RUNNER_TEMP/objdiff-cli"
      - name: Verify and restore exact queue export
        id: restore
        if: github.event_name == 'push' && needs.policy.outputs.mode == 'reuse'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_export_reuse.py --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT" --objdiff "$RUNNER_TEMP/objdiff-cli"
      # Full queue discovery is literal and cannot be suppressed by route outputs.
      - name: Run complete tool suite
        if: github.event_name == 'merge_group' || needs.policy.outputs.mode == 'full' || (github.event_name == 'push' && needs.policy.outputs.mode == 'reuse' && steps.restore.outputs.reused != 'true')
        run: python -m unittest discover -s tests -v
      - name: Record primary maintainer local validation trust
        if: needs.policy.outputs.mode == 'local'
        run: echo 'Tool test route **local** trusts the authenticated primary maintainer local validation; no remote tool tests were executed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish committed primary maintainer local reports
        if: github.event_name == 'push' && needs.policy.outputs.mode == 'local'
        run: python scripts/ci_export.py --mode local --event "$GITHUB_EVENT_PATH"
      - name: Generate and validate complete exports
        if: github.event_name == 'merge_group' || needs.policy.outputs.mode == 'full' || (github.event_name == 'push' && needs.policy.outputs.mode == 'reuse' && steps.restore.outputs.reused != 'true')
        run: python scripts/ci_export.py --mode full --objdiff "$RUNNER_TEMP/objdiff-cli"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && needs.policy.outputs.mode == 'local'
        with:
          name: SCUS_972.68_local-provenance
          path: build/decomp/local-provenance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'merge_group' || needs.policy.outputs.mode == 'full'
        with:
          name: SCUS_972.68_verified-export-${{ github.run_attempt }}
          path: build/decomp/verified-export/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || needs.policy.outputs.mode == 'full'
        with:
          name: SCUS_972.68_report
          path: build/decomp/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || needs.policy.outputs.mode == 'full'
        with:
          name: SCUS_972.68_source-modules
          path: build/decomp/source-modules.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || needs.policy.outputs.mode == 'full'
        with:
          name: SCUS_972.68_authored_source
          path: progress/source-inventory.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || needs.policy.outputs.mode == 'full'
        with:
          name: SCUS_972.68-unique_report
          path: build/decomp/unique-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || needs.policy.outputs.mode == 'full'
        with:
          name: SCUS_972.68_unique-metrics
          path: build/decomp/unique-summary.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || needs.policy.outputs.mode == 'full'
        with:
          name: SCUS_972.68_code-reuse
          path: |
            progress/code-reuse-report.json
            progress/code-reuse-families.json.gz
          if-no-files-found: error
  tests:
    name: tests
    needs: [policy, validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require verified shared validation
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$VALIDATION_RESULT" = success
  progress:
    name: SCUS_972.68 Progress
    needs: [policy, validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require verified shared progress
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$VALIDATION_RESULT" = success
