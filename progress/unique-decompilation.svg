<svg xmlns="http://www.w3.org/2000/svg" width="760" height="242" viewBox="0 0 760 242" role="img" aria-labelledby="title description">
<title id="title">RAC2 unique and loaded code progress</title>
<desc id="description">Two separate measured ratios. Unique code follows the documented structural grouping policy; loaded code counts every executable placement across the boot and 27 overlays.</desc>
<rect width="760" height="242" rx="12" fill="#0d1117"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="28" fill="#c9d1d9" font-size="14" font-weight="600">CONSERVATIVE UNIQUE EE CODE</text>
<text x="730" y="28" text-anchor="end" fill="#e89b35" font-size="20">0.8611%</text>
<rect x="30" y="43" width="700" height="18" rx="9" fill="#30363d"/>
<clipPath id="rail0"><rect x="30" y="43" width="700" height="18" rx="9"/></clipPath>
<rect x="30" y="43" width="6.027608" height="18" fill="#e89b35" clip-path="url(#rail0)"/>
<text x="30" y="87" fill="#c9d1d9" font-size="14">382,324 / 44,400,168 grouped bytes under the stated policy</text>
<text x="30" y="140" fill="#c9d1d9" font-size="14" font-weight="600">LOADED CODE</text>
<text x="730" y="140" text-anchor="end" fill="#e89b35" font-size="20">2.3707%</text>
<rect x="30" y="155" width="700" height="18" rx="9" fill="#30363d"/>
<clipPath id="rail1"><rect x="30" y="155" width="700" height="18" rx="9"/></clipPath>
<rect x="30" y="155" width="16.594652" height="18" fill="#e89b35" clip-path="url(#rail1)"/>
<text x="30" y="199" fill="#c9d1d9" font-size="14">1,156,604 / 48,788,176 loaded bytes across all placements</text>
<text x="30" y="230" fill="#8b949e" font-size="12">Matching C / C++ | Target: 100% | See the metric policy and its remaining limitations</text>
</g></svg>
